<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лесной кошмар</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }

        #menuOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #c0b8a0;
            z-index: 10;
            backdrop-filter: blur(6px);
            transition: opacity 0.5s;
        }
        #menuOverlay.hidden { opacity: 0; pointer-events: none; }
        #menuOverlay h1 {
            font-size: 4em;
            text-shadow: 0 0 30px #8a2b2b;
            letter-spacing: 8px;
            margin-bottom: 10px;
            color: #e0d5b0;
        }
        #menuOverlay p.sub {
            font-size: 1.2em;
            color: #a09070;
            margin-bottom: 40px;
        }
        .menu-btn {
            background: #2a1e12;
            border: 2px solid #6a5a3a;
            color: #d4c8a0;
            padding: 15px 50px;
            margin: 10px;
            font-size: 1.4em;
            cursor: pointer;
            border-radius: 40px;
            transition: all 0.2s;
            width: 260px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .menu-btn:hover {
            background: #4a3a22;
            border-color: #b09050;
            box-shadow: 0 0 30px #6a4a1a;
            transform: scale(1.05);
        }
        .menu-btn.small { font-size: 1em; padding: 10px 30px; width: 200px; }
        #settingsPanel {
            display: none;
            flex-direction: column;
            align-items: center;
            background: #1a140e;
            padding: 30px 50px;
            border-radius: 20px;
            border: 1px solid #5a4a30;
            margin-top: 20px;
        }
        #settingsPanel label {
            font-size: 1.2em;
            margin: 10px 0;
            color: #b0a080;
        }
        #settingsPanel input[type="range"] {
            width: 200px;
            background: #3a2e1e;
            accent-color: #b09050;
        }
        #settingsPanel .save-load-row {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        #hud {
            position: fixed;
            top: 20px; left: 20px;
            color: #d0c8b0;
            font-size: 1.4em;
            text-shadow: 0 0 20px black;
            background: rgba(0,0,0,0.5);
            padding: 12px 24px;
            border-radius: 12px;
            border-left: 4px solid #b09050;
            z-index: 5;
            pointer-events: none;
            font-family: monospace;
            letter-spacing: 1px;
        }
        #hud span { color: #f0e080; font-weight: bold; }
        #hud .monster-status {
            font-size: 0.7em;
            color: #ff6a4a;
            margin-top: 4px;
        }

        #controlsHint {
            position: fixed;
            bottom: 30px; left: 50%;
            transform: translateX(-50%);
            color: #a09070;
            background: rgba(0,0,0,0.6);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.9em;
            letter-spacing: 1px;
            border: 1px solid #3a2e1e;
            z-index: 5;
            pointer-events: none;
            white-space: nowrap;
        }

        #itemCounter {
            position: fixed;
            top: 80px; right: 30px;
            color: #e0d5b0;
            font-size: 1.8em;
            text-shadow: 0 0 20px black;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 12px;
            border-right: 4px solid #b09050;
            z-index: 5;
            pointer-events: none;
            font-family: monospace;
        }
        #itemCounter .count { color: #f0e080; font-weight: bold; }

        #whistleCooldown {
            position: fixed;
            bottom: 100px; left: 50%;
            transform: translateX(-50%);
            color: #ffcc88;
            font-size: 1.2em;
            background: rgba(0,0,0,0.6);
            padding: 6px 18px;
            border-radius: 20px;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #whistleCooldown.show { opacity: 1; }

        /* Загрузка — теперь просто текст поверх меню */
        #loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0806;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b09050;
            font-size: 2.5em;
            z-index: 100;
            transition: opacity 0.8s;
            letter-spacing: 4px;
            font-weight: 300;
            text-shadow: 0 0 20px #6a4a1a;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #3a2e1e;
            border-top: 4px solid #b09050;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading .text { display: flex; align-items: center; }
    </style>
</head>
<body>

    <!-- Загрузка -->
    <div id="loading">
        <div class="text">
            <div class="spinner"></div>
            <span>Загрузка игры…</span>
        </div>
    </div>

    <!-- Меню -->
    <div id="menuOverlay">
        <h1>🌲 ЛЕСНОЙ КОШМАР</h1>
        <p class="sub">Найди 15 предметов, пока монстр не нашёл тебя</p>
        <div id="mainButtons">
            <div class="menu-btn" id="playBtn">▶ ИГРАТЬ</div>
            <div class="menu-btn small" id="settingsBtn">⚙ Настройки</div>
            <div class="menu-btn small" id="loadBtn">📂 Загрузить игру</div>
        </div>
        <div id="settingsPanel">
            <label>Чувствительность мыши: <span id="sensVal">0.8</span></label>
            <input type="range" id="sensitivity" min="0.2" max="2.0" step="0.05" value="0.8">
            <label>Громкость шагов (эффект): <span id="volVal">0.5</span></label>
            <input type="range" id="volume" min="0" max="1.0" step="0.05" value="0.5">
            <div class="save-load-row">
                <div class="menu-btn small" id="saveGameBtn">💾 Сохранить</div>
                <div class="menu-btn small" id="loadGameBtn">📂 Загрузить</div>
            </div>
            <div class="menu-btn small" id="backMenuBtn" style="margin-top:20px;">← Назад</div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud">
        📦 Предметов: <span id="hudCount">0</span> / 15
        <div class="monster-status" id="monsterStatus">👹 Монстр: не видит</div>
    </div>
    <div id="itemCounter">
        🎯 <span class="count" id="bigCount">0</span>/15
    </div>
    <div id="controlsHint">WASD — движение | Мышь — осмотр | F — свистнуть | ПКМ — фонарик</div>
    <div id="whistleCooldown">⏳ Свисток перезаряжается...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ----- Конфигурация -----
        const ITEMS_TOTAL = 15;
        const WHISTLE_COOLDOWN = 8;
        const MONSTER_SPEED = 2.8;
        const PLAYER_SPEED = 4.5;
        const MONSTER_VIEW_RADIUS = 28;
        const MONSTER_LOSE_RADIUS = 40;
        const ITEM_PICKUP_RADIUS = 1.8;

        // ----- Состояние игры -----
        const state = {
            itemsCollected: 0,
            collectedIds: new Set(),
            items: [],
            monsterTarget: null,
            whistlePos: null,
            whistleCooldown: 0,
            monsterPaused: false,
            monsterPauseTimer: 0,
            isMonsterAggro: false,
            monsterLastSeenPlayer: null,
            gameActive: false,
            flashlightOn: true,
            playerPos: new THREE.Vector3(0, 1.7, 0),
            playerRot: 0,
        };

        // ----- Сцена, камера, рендер -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a12);
        scene.fog = new THREE.FogExp2(0x0a0a12, 0.012);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 1.7, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // Постобработка
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.3, 0.2, 0.1
        );
        composer.addPass(bloomPass);
        const outputPass = new OutputPass();
        composer.addPass(outputPass);

        // ----- Управление -----
        const controls = new PointerLockControls(camera, document.body);
        controls.lockSpeed = 0.002;
        let isLocked = false;
        controls.addEventListener('lock', () => { isLocked = true; });
        controls.addEventListener('unlock', () => { isLocked = false; });

        // ----- Освещение -----
        const ambientLight = new THREE.AmbientLight(0x1a1a30, 0.4);
        scene.add(ambientLight);

        const moonLight = new THREE.DirectionalLight(0x445577, 0.8);
        moonLight.position.set(-20, 30, -10);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 1024;
        moonLight.shadow.mapSize.height = 1024;
        const d = 40;
        moonLight.shadow.camera.left = -d;
        moonLight.shadow.camera.right = d;
        moonLight.shadow.camera.top = d;
        moonLight.shadow.camera.bottom = -d;
        moonLight.shadow.camera.near = 1;
        moonLight.shadow.camera.far = 60;
        scene.add(moonLight);

        const backLight = new THREE.DirectionalLight(0x335577, 0.3);
        backLight.position.set(10, 5, 20);
        scene.add(backLight);

        const flashlight = new THREE.SpotLight(0xffeedd, 4);
        flashlight.angle = 0.4;
        flashlight.penumbra = 0.5;
        flashlight.decay = 1.5;
        flashlight.distance = 50;
        flashlight.castShadow = true;
        flashlight.shadow.mapSize.width = 512;
        flashlight.shadow.mapSize.height = 512;
        camera.add(flashlight);
        camera.add(flashlight.target);
        flashlight.target.position.set(0, 0, -10);
        scene.add(camera);

        // ----- Генерация леса (быстро) -----
        function createTree(x, z) {
            const group = new THREE.Group();
            const trunkH = 1.5 + Math.random() * 2.5;
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.2 + Math.random()*0.15, 0.3 + Math.random()*0.2, trunkH, 6),
                new THREE.MeshStandardMaterial({ color: 0x3d2b1a, roughness: 0.9 })
            );
            trunk.position.y = trunkH/2;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            group.add(trunk);

            const crownR = 1.0 + Math.random() * 1.2;
            const crown = new THREE.Mesh(
                new THREE.SphereGeometry(crownR, 7, 6),
                new THREE.MeshStandardMaterial({ color: 0x1a3a1a, roughness: 0.7, emissive: new THREE.Color(0x0a1a0a), emissiveIntensity: 0.1 })
            );
            crown.position.y = trunkH + crownR * 0.6;
            crown.castShadow = true;
            crown.receiveShadow = true;
            group.add(crown);

            group.rotation.y = Math.random() * Math.PI * 2;
            group.position.set(x, 0, z);
            return group;
        }

        // Генерируем деревья асинхронно, но для скорости — сразу
        const treePositions = [];
        for (let i = 0; i < 300; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 8 + Math.random() * 65;
            const x = Math.cos(angle) * dist;
            const z = Math.sin(angle) * dist;
            if (Math.abs(x) < 5 && Math.abs(z) < 5) continue;
            const tree = createTree(x, z);
            scene.add(tree);
            treePositions.push({x, z});
        }

        // ----- Палатка -----
        function createTent() {
            const group = new THREE.Group();
            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(1.8, 2.2, 0.2, 8),
                new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.8 })
            );
            base.position.y = 0.1;
            base.receiveShadow = true;
            base.castShadow = true;
            group.add(base);

            const fabric = new THREE.Mesh(
                new THREE.ConeGeometry(2.0, 1.8, 6),
                new THREE.MeshStandardMaterial({ color: 0x6a5a3a, roughness: 0.9, emissive: new THREE.Color(0x2a1a0a), emissiveIntensity: 0.2 })
            );
            fabric.position.y = 1.0;
            fabric.castShadow = true;
            fabric.receiveShadow = true;
            group.add(fabric);

            const entrance = new THREE.Mesh(
                new THREE.PlaneGeometry(0.8, 1.2),
                new THREE.MeshStandardMaterial({ color: 0x0a0a08, emissive: new THREE.Color(0x1a0a04), emissiveIntensity: 0.3, side: THREE.DoubleSide })
            );
            entrance.position.set(0, 0.6, 1.75);
            group.add(entrance);

            const fire = new THREE.Mesh(
                new THREE.SphereGeometry(0.3, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0xff5500, emissive: new THREE.Color(0xff4400), emissiveIntensity: 0.8 })
            );
            fire.position.set(2.2, 0.2, 1.5);
            group.add(fire);
            const coals = new THREE.Mesh(
                new THREE.CylinderGeometry(0.6, 0.8, 0.1, 8),
                new THREE.MeshStandardMaterial({ color: 0x331100, emissive: new THREE.Color(0x441100), emissiveIntensity: 0.3 })
            );
            coals.position.set(2.2, 0.05, 1.5);
            group.add(coals);

            group.position.set(0, 0, 0);
            return group;
        }
        scene.add(createTent());

        // ----- Создание предметов -----
        const itemColors = [0xff4444, 0x44ff44, 0x4444ff, 0xffff44, 0xff44ff, 0x44ffff, 0xff8800, 0x88ff00, 0x0088ff, 0xff0088, 0x8800ff, 0x00ff88, 0xaa88ff, 0xffaa88, 0x88ffaa];
        const itemNames = ['Ключ', 'Фляга', 'Карта', 'Компас', 'Аптечка', 'Нож', 'Фонарик (старый)', 'Батарейка', 'Записка', 'Кристалл', 'Кольцо', 'Фигурка', 'Свеча', 'Осколок', 'Амулет'];

        function createItem(index) {
            const type = Math.floor(Math.random() * 3);
            let geo;
            if (type === 0) geo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
            else if (type === 1) geo = new THREE.SphereGeometry(0.3, 8, 6);
            else geo = new THREE.CylinderGeometry(0.25, 0.25, 0.5, 6);
            const mat = new THREE.MeshStandardMaterial({
                color: itemColors[index % itemColors.length],
                emissive: new THREE.Color(0x442200),
                emissiveIntensity: 0.2,
                roughness: 0.4,
                metalness: 0.3
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            let pos;
            let attempts = 0;
            do {
                const angle = Math.random() * Math.PI * 2;
                const dist = 6 + Math.random() * 40;
                pos = new THREE.Vector3(Math.cos(angle) * dist, 0.4, Math.sin(angle) * dist);
                attempts++;
            } while (attempts < 50 && (pos.length() < 4 || pos.length() > 45));
            mesh.position.copy(pos);
            mesh.rotation.set(Math.random()*0.5, Math.random()*Math.PI*2, Math.random()*0.5);
            const glow = new THREE.PointLight(0xffaa44, 0.15, 4);
            glow.position.copy(pos);
            glow.position.y = 0.6;
            scene.add(glow);
            mesh.userData = { id: index, name: itemNames[index % itemNames.length], collected: false, glow: glow };
            return mesh;
        }

        const itemMeshes = [];
        for (let i = 0; i < ITEMS_TOTAL; i++) {
            const mesh = createItem(i);
            scene.add(mesh);
            itemMeshes.push(mesh);
            state.items.push(mesh);
        }

        // ----- Монстр -----
        function createMonster() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.6, 0.8, 1.8, 6),
                new THREE.MeshStandardMaterial({ color: 0x2a1a1a, roughness: 0.9, emissive: new THREE.Color(0x1a0a0a), emissiveIntensity: 0.2 })
            );
            body.position.y = 0.9;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.5, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0x3a2a2a, roughness: 0.8, emissive: new THREE.Color(0x2a0a0a), emissiveIntensity: 0.3 })
            );
            head.position.y = 1.9;
            head.castShadow = true;
            head.receiveShadow = true;
            group.add(head);

            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff2200, emissive: new THREE.Color(0xff0000), emissiveIntensity: 0.6 });
            const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6), eyeMat);
            eye1.position.set(-0.2, 2.0, 0.5);
            group.add(eye1);
            const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6), eyeMat);
            eye2.position.set(0.2, 2.0, 0.5);
            group.add(eye2);

            const armMat = new THREE.MeshStandardMaterial({ color: 0x2a1a1a, roughness: 0.9 });
            const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 1.0, 4), armMat);
            armL.position.set(-0.7, 1.2, 0);
            armL.rotation.z = 0.3;
            armL.castShadow = true;
            group.add(armL);
            const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 1.0, 4), armMat);
            armR.position.set(0.7, 1.2, 0);
            armR.rotation.z = -0.3;
            armR.castShadow = true;
            group.add(armR);

            group.position.set(12, 0, 8);
            return group;
        }
        const monster = createMonster();
        scene.add(monster);
        let monsterTargetPos = new THREE.Vector3(12, 0, 8);
        let monsterState = 'idle';

        // ----- Звуки -----
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playWhistleSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2000, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }

        function playItemPickup() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        // ----- Сохранение/загрузка -----
        function saveGame() {
            const data = {
                playerPos: camera.position.toArray(),
                playerRot: camera.rotation.y,
                itemsCollected: state.itemsCollected,
                collectedIds: Array.from(state.collectedIds),
                monsterPos: monster.position.toArray(),
                monsterState: monsterState,
                monsterTarget: state.monsterTarget,
                whistleCooldown: state.whistleCooldown,
                flashlightOn: state.flashlightOn,
            };
            localStorage.setItem('horrorSave', JSON.stringify(data));
            alert('Игра сохранена!');
        }

        function loadGame() {
            const raw = localStorage.getItem('horrorSave');
            if (!raw) { alert('Нет сохранения.'); return; }
            try {
                const data = JSON.parse(raw);
                camera.position.fromArray(data.playerPos);
                camera.rotation.y = data.playerRot || 0;
                state.itemsCollected = data.itemsCollected || 0;
                state.collectedIds = new Set(data.collectedIds || []);
                state.items.forEach(mesh => {
                    const id = mesh.userData.id;
                    const collected = state.collectedIds.has(id);
                    mesh.visible = !collected;
                    if (mesh.userData.glow) mesh.userData.glow.visible = !collected;
                });
                monster.position.fromArray(data.monsterPos || [12,0,8]);
                monsterState = data.monsterState || 'idle';
                state.monsterTarget = data.monsterTarget || null;
                state.whistleCooldown = data.whistleCooldown || 0;
                state.flashlightOn = data.flashlightOn !== undefined ? data.flashlightOn : true;
                flashlight.visible = state.flashlightOn;
                updateHUD();
                alert('Игра загружена!');
            } catch(e) { alert('Ошибка загрузки.'); }
        }

        // ----- HUD -----
        function updateHUD() {
            document.getElementById('hudCount').textContent = state.itemsCollected;
            document.getElementById('bigCount').textContent = state.itemsCollected;
            const status = document.getElementById('monsterStatus');
            if (state.isMonsterAggro) {
                status.textContent = '👹 Монстр: видит тебя!';
                status.style.color = '#ff4a2a';
            } else {
                status.textContent = '👹 Монстр: не видит';
                status.style.color = '#ff6a4a';
            }
        }

        // ----- Игровой цикл -----
        let clock = new THREE.Clock();
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;

        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'KeyF': 
                    if (state.gameActive && state.whistleCooldown <= 0) {
                        whistle();
                    }
                    break;
                case 'Space': 
                    if (state.gameActive) {
                        state.flashlightOn = !state.flashlightOn;
                        flashlight.visible = state.flashlightOn;
                    }
                    break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        function whistle() {
            if (state.whistleCooldown > 0) return;
            initAudio();
            playWhistleSound();
            state.whistleCooldown = WHISTLE_COOLDOWN;
            state.whistlePos = camera.position.clone().add(new THREE.Vector3(0, 0, -5));
            state.monsterTarget = 'whistle';
            const ringGeo = new THREE.RingGeometry(0.5, 1.0, 16);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xffaa44, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.copy(state.whistlePos);
            ring.position.y = 0.2;
            ring.lookAt(camera.position);
            scene.add(ring);
            setTimeout(() => { scene.remove(ring); }, 1000);
            const el = document.getElementById('whistleCooldown');
            el.classList.add('show');
            setTimeout(() => { el.classList.remove('show'); }, WHISTLE_COOLDOWN * 1000);
        }

        function updateMonster(delta) {
            if (!state.gameActive) return;
            const playerPos = camera.position;
            const monsterPos = monster.position;
            const distToPlayer = playerPos.distanceTo(monsterPos);

            if (state.whistleCooldown > 0) {
                state.whistleCooldown -= delta;
                if (state.whistleCooldown < 0) state.whistleCooldown = 0;
            }

            let canSeePlayer = false;
            if (distToPlayer < MONSTER_VIEW_RADIUS) {
                const dir = new THREE.Vector3().copy(playerPos).sub(monsterPos).normalize();
                const raycaster = new THREE.Raycaster(monsterPos, dir, 0, MONSTER_VIEW_RADIUS);
                const intersects = raycaster.intersectObjects(scene.children, true);
                let blocked = false;
                for (let hit of intersects) {
                    if (hit.distance > distToPlayer) break;
                    if (hit.object.userData && hit.object.userData.id !== undefined) continue;
                    if (hit.object.parent && hit.object.parent === monster) continue;
                    if (hit.object.geometry && (hit.object.geometry.type === 'CylinderGeometry' || hit.object.geometry.type === 'SphereGeometry' || hit.object.geometry.type === 'ConeGeometry')) {
                        if (hit.object.material.color.getHex() === 0x3d2b1a || hit.object.material.color.getHex() === 0x1a3a1a) {
                            blocked = true;
                            break;
                        }
                    }
                }
                if (!blocked) canSeePlayer = true;
            }

            if (canSeePlayer) {
                state.isMonsterAggro = true;
                state.monsterTarget = 'player';
                state.monsterLastSeenPlayer = playerPos.clone();
            } else {
                if (state.isMonsterAggro && distToPlayer > MONSTER_LOSE_RADIUS) {
                    state.isMonsterAggro = false;
                    state.monsterTarget = null;
                }
            }

            let target = null;
            if (state.monsterTarget === 'player') {
                if (canSeePlayer) target = playerPos.clone();
                else if (state.monsterLastSeenPlayer) target = state.monsterLastSeenPlayer.clone();
            } else if (state.monsterTarget === 'whistle') {
                if (state.whistlePos) target = state.whistlePos.clone();
                if (state.whistleCooldown < WHISTLE_COOLDOWN - 2) {
                    state.monsterTarget = null;
                }
            }

            if (target) {
                const dirToTarget = new THREE.Vector3().copy(target).sub(monsterPos);
                const distToTarget = dirToTarget.length();
                if (distToTarget > 0.5) {
                    const move = dirToTarget.normalize().multiplyScalar(MONSTER_SPEED * delta);
                    monsterPos.add(move);
                    const angle = Math.atan2(dirToTarget.x, dirToTarget.z);
                    monster.rotation.y = angle;
                } else {
                    if (state.monsterTarget === 'whistle') {
                        state.monsterTarget = null;
                        state.whistlePos = null;
                    }
                }
                if (state.monsterTarget === 'player' && distToPlayer < 1.5) {
                    gameOver('Монстр настиг вас!');
                }
            } else {
                if (!state.isMonsterAggro && Math.random() < 0.001) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 5 + Math.random() * 15;
                    const newTarget = new THREE.Vector3(
                        monsterPos.x + Math.cos(angle) * dist,
                        0,
                        monsterPos.z + Math.sin(angle) * dist
                    );
                    if (newTarget.length() < 60) {
                        state.monsterTarget = 'wander';
                        state.whistlePos = newTarget;
                    }
                }
                if (state.monsterTarget === 'wander' && state.whistlePos) {
                    const dir = new THREE.Vector3().copy(state.whistlePos).sub(monsterPos);
                    if (dir.length() > 0.5) {
                        const move = dir.normalize().multiplyScalar(MONSTER_SPEED * 0.4 * delta);
                        monsterPos.add(move);
                        monster.rotation.y = Math.atan2(dir.x, dir.z);
                    } else {
                        state.monsterTarget = null;
                        state.whistlePos = null;
                    }
                }
            }
            updateHUD();
        }

        function gameOver(reason) {
            state.gameActive = false;
            controls.unlock();
            document.getElementById('menuOverlay').classList.remove('hidden');
            document.getElementById('menuOverlay').innerHTML = `
                <h1>💀 ВЫ УМЕРЛИ</h1>
                <p class="sub">${reason}</p>
                <p>Собрано предметов: ${state.itemsCollected} / 15</p>
                <div class="menu-btn" onclick="location.reload()">↻ Попробовать снова</div>
                <div class="menu-btn small" id="menuMainBtn">🏠 Главное меню</div>
            `;
            document.getElementById('menuMainBtn').addEventListener('click', () => { location.reload(); });
        }

        function checkPickups() {
            if (!state.gameActive) return;
            const playerPos = camera.position;
            state.items.forEach(mesh => {
                if (mesh.visible === false) return;
                const dist = playerPos.distanceTo(mesh.position);
                if (dist < ITEM_PICKUP_RADIUS) {
                    const id = mesh.userData.id;
                    if (!state.collectedIds.has(id)) {
                        state.collectedIds.add(id);
                        state.itemsCollected++;
                        mesh.visible = false;
                        if (mesh.userData.glow) mesh.userData.glow.visible = false;
                        playItemPickup();
                        updateHUD();
                        if (state.itemsCollected >= ITEMS_TOTAL) {
                            gameOver('Поздравляем! Вы собрали все 15 предметов! Вы победили!');
                            document.getElementById('menuOverlay').innerHTML = `
                                <h1>🏆 ВЫ ПОБЕДИЛИ!</h1>
                                <p class="sub">Вы нашли все 15 предметов и сбежали из леса!</p>
                                <div class="menu-btn" onclick="location.reload()">↻ Играть снова</div>
                            `;
                        }
                    }
                }
            });
        }

        // ----- Старт игры -----
        function startGame() {
            document.getElementById('menuOverlay').classList.add('hidden');
            document.getElementById('loading').classList.add('hidden');
            controls.lock();
            state.gameActive = true;
            updateHUD();
            flashlight.visible = state.flashlightOn;
        }

        // ----- Обработчики меню -----
        document.getElementById('playBtn').addEventListener('click', () => {
            initAudio();
            startGame();
        });

        document.getElementById('settingsBtn').addEventListener('click', () => {
            document.getElementById('mainButtons').style.display = 'none';
            document.getElementById('settingsPanel').style.display = 'flex';
        });

        document.getElementById('backMenuBtn').addEventListener('click', () => {
            document.getElementById('settingsPanel').style.display = 'none';
            document.getElementById('mainButtons').style.display = 'flex';
        });

        document.getElementById('saveGameBtn').addEventListener('click', saveGame);
        document.getElementById('loadGameBtn').addEventListener('click', loadGame);
        document.getElementById('loadBtn').addEventListener('click', () => {
            loadGame();
            startGame();
        });

        // Настройки
        const sensSlider = document.getElementById('sensitivity');
        const sensVal = document.getElementById('sensVal');
        sensSlider.addEventListener('input', () => {
            const val = parseFloat(sensSlider.value);
            sensVal.textContent = val.toFixed(2);
            controls.lockSpeed = val * 0.002;
        });
        const volSlider = document.getElementById('volume');
        const volVal = document.getElementById('volVal');
        volSlider.addEventListener('input', () => {
            volVal.textContent = parseFloat(volSlider.value).toFixed(2);
        });

        // ----- Анимация -----
        function animate() {
            const delta = Math.min(clock.getDelta(), 0.05);
            if (state.gameActive && isLocked) {
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                const speed = PLAYER_SPEED * delta;
                let moveVec = new THREE.Vector3(0, 0, 0);
                if (moveForward) moveVec.add(forward);
                if (moveBackward) moveVec.sub(forward);
                if (moveLeft) moveVec.sub(right);
                if (moveRight) moveVec.add(right);
                if (moveVec.length() > 0) {
                    moveVec.normalize().multiplyScalar(speed);
                    camera.position.add(moveVec);
                    const limit = 55;
                    if (camera.position.length() > limit) {
                        camera.position.normalize().multiplyScalar(limit);
                    }
                }
                flashlight.target.position.set(0, 0, -5);
                updateMonster(delta);
                checkPickups();
            }
            composer.render();
            requestAnimationFrame(animate);
        }

        animate();

        // ----- Ресайз -----
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Блокировка
        renderer.domElement.addEventListener('click', () => {
            if (state.gameActive && !isLocked) {
                controls.lock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            if (!document.pointerLockElement && state.gameActive) {
                document.getElementById('controlsHint').style.opacity = '1';
            } else {
                document.getElementById('controlsHint').style.opacity = '0.6';
            }
        });

        // Скрываем загрузку, как только сцена готова (сразу после инициализации)
        document.getElementById('loading').classList.add('hidden');

        console.log('SWILL: Игра запущена.');
    </script>
</body>
</html>
